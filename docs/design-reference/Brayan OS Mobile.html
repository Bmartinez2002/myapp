<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8" />
<title>BRAYAN OS · Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:oklch(0.08 0.005 250);
    --bg-1:oklch(0.16 0.006 250);
    --bg-2:oklch(0.215 0.008 250);
    --bg-3:oklch(0.26 0.009 250);
    --hair:oklch(0.28 0.008 250 / .8);
    --line:oklch(0.32 0.008 250 / .65);
    --fg:oklch(0.975 0.004 250);
    --fg-2:oklch(0.78 0.005 250);
    --fg-3:oklch(0.6 0.005 250);
    --fg-4:oklch(0.45 0.005 250);
    --accent:oklch(0.85 0.18 150);
    --accent-2:oklch(0.72 0.17 250);
    --warn:oklch(0.82 0.16 80);
    --danger:oklch(0.7 0.2 25);
    --sans:'Geist','Inter',ui-sans-serif,system-ui,sans-serif;
    --mono:'Geist Mono','JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0a0a0c;color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{background:
    radial-gradient(900px 600px at 12% -10%, oklch(0.72 0.17 250 / .06), transparent 60%),
    radial-gradient(800px 500px at 100% 110%, oklch(0.85 0.18 150 / .04), transparent 60%),
    #0a0a0c;
    min-height:100vh;
  }
  @keyframes blink{ 50%{opacity:0} }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="mobile-shared.jsx"></script>
  <script type="text/babel" src="mobile-screens-1.jsx"></script>
  <script type="text/babel" src="mobile-screens-2.jsx"></script>
  <script type="text/babel" src="mobile-screens-3.jsx"></script>
  <script type="text/babel" src="mobile-screens-4.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;

    function App(){
      return (
        <DesignCanvas>
          <DCSection id="entry" title="Wake-up & Capture" subtitle="Primer contacto del día · operator mode">
            <DCArtboard id="lock" label="01 · Lock + AI Briefing" width={420} height={894}>
              <div style={{display:'grid', placeItems:'center', padding:9, width:'100%', height:'100%'}}>
                <window.ScreenLock/>
              </div>
            </DCArtboard>
            <DCArtboard id="capture" label="02 · Quick Capture" width={420} height={894}>
              <div style={{display:'grid', placeItems:'center', padding:9, width:'100%', height:'100%'}}>
                <window.ScreenCapture/>
              </div>
            </DCArtboard>
            <DCArtboard id="ai" label="03 · AI Operator" width={420} height={894}>
              <div style={{display:'grid', placeItems:'center', padding:9, width:'100%', height:'100%'}}>
                <window.ScreenAI/>
              </div>
            </DCArtboard>
          </DCSection>

          <DCSection id="money" title="Daily Money Control" subtitle="Control diario · anti-fuga · disciplina">
            <DCArtboard id="today" label="08 · Today · feed del día" width={420} height={894}>
              <div style={{display:'grid', placeItems:'center', padding:9, width:'100%', height:'100%'}}>
                <window.ScreenToday/>
              </div>
            </DCArtboard>
            <DCArtboard id="capture2" label="09 · Capture v2 · emoción + impulso" width={420} height={894}>
              <div style={{display:'grid', placeItems:'center', padding:9, width:'100%', height:'100%'}}>
                <window.ScreenCapture2/>
              </div>
            </DCArtboard>
            <DCArtboard id="fuga" label="10 · Anti-fuga · índice" width={420} height={894}>
              <div style={{display:'grid', placeItems:'center', padding:9, width:'100%', height:'100%'}}>
                <window.ScreenFuga/>
              </div>
            </DCArtboard>
            <DCArtboard id="disc" label="11 · Disciplina · streaks" width={420} height={894}>
              <div style={{display:'grid', placeItems:'center', padding:9, width:'100%', height:'100%'}}>
                <window.ScreenDiscipline/>
              </div>
            </DCArtboard>
          </DCSection>

          <DCSection id="core" title="Sesión diaria" subtitle="Centro de control del operador">
            <DCArtboard id="home" label="04 · Home · Stability Index" width={420} height={894}>
              <div style={{display:'grid', placeItems:'center', padding:9, width:'100%', height:'100%'}}>
                <window.ScreenHome/>
              </div>
            </DCArtboard>
            <DCArtboard id="meta" label="05 · Meta 20M · Trajectory" width={420} height={894}>
              <div style={{display:'grid', placeItems:'center', padding:9, width:'100%', height:'100%'}}>
                <window.ScreenMeta/>
              </div>
            </DCArtboard>
          </DCSection>

          <DCSection id="founder" title="Founder & Reflexión" subtitle="CEO mode + cierre semanal">
            <DCArtboard id="ceo" label="06 · CEO Mode" width={420} height={894}>
              <div style={{display:'grid', placeItems:'center', padding:9, width:'100%', height:'100%'}}>
                <window.ScreenCEO/>
              </div>
            </DCArtboard>
            <DCArtboard id="review" label="07 · Weekly Review · Story" width={420} height={894}>
              <div style={{display:'grid', placeItems:'center', padding:9, width:'100%', height:'100%'}}>
                <window.ScreenWeekly/>
              </div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
