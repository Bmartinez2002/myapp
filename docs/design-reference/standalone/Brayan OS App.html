<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8" />
<title>BRAYAN OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111315" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BRAYAN OS" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIkJSQVlBTiBPUyIsCiAgInNob3J0X25hbWUiOiAiQlJBWUFOIE9TIiwKICAic3RhcnRfdXJsIjogIi4vIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAib3JpZW50YXRpb24iOiAicG9ydHJhaXQiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMxMTEzMTUiLAogICJ0aGVtZV9jb2xvciI6ICIjMTExMzE1IiwKICAibGFuZyI6ICJlcy1DTyIKfQ==">
<style>
  :root{
    --bg-0:oklch(0.10 0.005 250);
    --bg-1:oklch(0.16 0.006 250);
    --bg-2:oklch(0.215 0.008 250);
    --bg-3:oklch(0.26 0.009 250);
    --hair:oklch(0.28 0.008 250 / .8);
    --fg:oklch(0.975 0.004 250);
    --fg-2:oklch(0.78 0.005 250);
    --fg-3:oklch(0.58 0.005 250);
    --fg-4:oklch(0.42 0.005 250);
    --accent:oklch(0.85 0.18 150);
    --accent-soft:oklch(0.85 0.18 150 / .14);
    --accent-2:oklch(0.72 0.17 250);
    --warn:oklch(0.82 0.16 80);
    --danger:oklch(0.7 0.2 25);
    --sans:'Geist','Inter',ui-sans-serif,system-ui,sans-serif;
    --mono:'Geist Mono','JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg-0);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  body{
    background:
      radial-gradient(900px 600px at 12% -10%, oklch(0.72 0.17 250 / .08), transparent 60%),
      radial-gradient(800px 500px at 100% 110%, oklch(0.85 0.18 150 / .05), transparent 60%),
      var(--bg-0);
    min-height:100dvh;
    padding-top:env(safe-area-inset-top);
  }
  button,input,textarea{font-family:inherit;color:inherit}
  ::selection{background:var(--accent-soft)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .micro{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-4)}
  .dim{color:var(--fg-3)}
  .h1{font-size:26px;font-weight:600;letter-spacing:-.022em;line-height:1.1}
  ::-webkit-scrollbar{display:none}
  .card{background:linear-gradient(180deg, oklch(0.19 .007 250) 0%, oklch(0.16 .006 250) 100%);border:1px solid var(--hair);border-radius:18px;padding:16px;position:relative;overflow:hidden}
  .card.glow{box-shadow:0 0 0 1px oklch(.85 .18 150 / .12), 0 20px 50px -20px oklch(.85 .18 150 / .35)}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;border:1px solid var(--hair);background:oklch(0.22 .007 250);color:var(--fg-2)}
  .chip.green{color:var(--accent);background:oklch(.85 .18 150 / .14);border-color:oklch(.85 .18 150 / .3)}
  .chip.blue{color:var(--accent-2);background:oklch(.72 .17 250 / .14);border-color:oklch(.72 .17 250 / .3)}
  .chip.amber{color:var(--warn);background:oklch(.82 .16 80 / .13);border-color:oklch(.82 .16 80 / .3)}
  .chip.red{color:var(--danger);background:oklch(.7 .2 25 / .13);border-color:oklch(.7 .2 25 / .3)}
  .bar{height:6px;border-radius:99px;background:var(--bg-2);overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg, var(--accent), var(--accent-2));border-radius:99px;box-shadow:0 0 10px oklch(.85 .18 150 / .4);transition:width .35s ease}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--bg-2);border:1px solid var(--hair);color:var(--fg);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--sans)}
  .btn.primary{background:linear-gradient(180deg, oklch(.93 .14 150), oklch(.78 .18 150));color:#06120c;border-color:oklch(.85 .18 150 / .6);box-shadow:0 0 24px oklch(.85 .18 150 / .35);font-weight:600}
  .btn:disabled{opacity:.5}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  @keyframes slide{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
  .slide{animation:slide .25s ease}
  .pulse{animation:pulse 1.4s ease-in-out infinite}
  .ico{flex:none;display:inline-flex;align-items:center;justify-content:center}
  .row{display:flex;align-items:center;gap:12px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .stack{display:flex;flex-direction:column}
  .grow{flex:1;min-width:0}
  .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hr{height:1px;background:var(--hair)}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;position:sticky;top:0;background:oklch(0.10 0.005 250 / .85);backdrop-filter:blur(16px);z-index:10;border-bottom:1px solid transparent}
  .topbar.with-border{border-bottom-color:var(--hair)}
  .logo{width:30px;height:30px;border-radius:8px;background:conic-gradient(from 210deg at 50% 50%, var(--accent), var(--accent-2), var(--accent));position:relative;box-shadow:0 0 16px oklch(.85 .18 150 / .35)}
  .logo::after{content:"";position:absolute;inset:5px;border-radius:4px;background:var(--bg-0)}
  .logo::before{content:"";position:absolute;inset:9px;border-radius:2px;background:linear-gradient(135deg, var(--accent), var(--accent-2));z-index:1}
  .iconbtn{width:34px;height:34px;border-radius:10px;background:var(--bg-2);border:1px solid var(--hair);color:var(--fg-2);display:grid;place-items:center}
  .view{padding:14px 16px 130px;display:flex;flex-direction:column;gap:14px}
  .view section{display:flex;flex-direction:column;gap:8px}
  .tabbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;background:oklch(0.16 .006 250 / .85);backdrop-filter:blur(18px);border:1px solid oklch(0.3 .008 250 / .7);border-radius:22px;padding:8px;z-index:20;box-shadow:0 20px 40px -10px oklch(0 0 0 / .6), 0 0 0 1px oklch(1 0 0 / .03) inset}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:0;color:var(--fg-3);padding:6px 0;cursor:pointer}
  .tab.on{color:var(--accent)}
  .tab .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
  .fab{width:54px;height:54px;border-radius:50%;justify-self:center;background:linear-gradient(180deg, oklch(.93 .14 150), oklch(.78 .18 150));border:none;color:#06120c;display:grid;place-items:center;box-shadow:0 0 0 1px oklch(.85 .18 150 / .5), 0 0 28px oklch(.85 .18 150 / .55);cursor:pointer}
  .sheet-overlay{position:fixed;inset:0;background:oklch(0 0 0 / .6);backdrop-filter:blur(8px);z-index:50;display:flex;flex-direction:column;justify-content:flex-end;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:linear-gradient(180deg, oklch(0.13 .005 250), oklch(0.10 .005 250));border-top-left-radius:24px;border-top-right-radius:24px;padding:14px 16px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--hair);border-bottom:none;animation:sheetup .3s cubic-bezier(.16,1,.3,1);max-height:92dvh;display:flex;flex-direction:column;overflow:hidden}
  @keyframes sheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-handle{width:36px;height:4px;border-radius:99px;background:var(--bg-3);margin:0 auto 12px}
  .input{width:100%;padding:14px 16px;border-radius:12px;background:var(--bg-1);border:1px solid var(--hair);color:var(--fg);font-size:15px;font-family:var(--mono);outline:none}
  .input:focus{border-color:var(--accent)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .key{padding:18px 0;border-radius:12px;background:var(--bg-2);border:1px solid var(--hair);font-size:22px;font-weight:500;font-family:var(--mono);cursor:pointer;color:var(--fg)}
  .key:active{background:var(--bg-3)}
  .key.alt{font-family:var(--sans);font-size:14px;color:var(--fg-3)}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .cat{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:14px;background:oklch(0.18 .007 250);border:1px solid var(--hair);cursor:pointer;min-height:78px;text-align:left}
  .cat.on{border-color:oklch(.85 .18 150 / .5);background:oklch(.85 .18 150 / .12);box-shadow:0 0 18px oklch(.85 .18 150 / .25)}
  .cat .emj{font-size:20px}
  .cat .nm{font-size:11.5px;font-weight:500}
  .seg{display:inline-flex;background:var(--bg-1);border:1px solid var(--hair);border-radius:10px;padding:2px;gap:2px}
  .seg button{background:transparent;border:0;color:var(--fg-3);padding:6px 14px;font-size:12px;border-radius:8px;cursor:pointer;font-family:var(--sans)}
  .seg button.on{background:var(--bg-3);color:var(--fg)}
  .habit-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid var(--hair)}
  .habit-row:first-child{border-top:0}
  .checkbox{width:32px;height:32px;border-radius:9px;background:var(--bg-2);border:1px solid var(--hair);display:grid;place-items:center;flex:none;cursor:pointer;transition:background .15s, border-color .15s}
  .checkbox.on{background:var(--accent);border-color:var(--accent);color:#06120c;box-shadow:0 0 14px var(--accent)}
  .streak-cell{aspect-ratio:1;border-radius:3px;background:var(--bg-2)}
  .streak-cell.on{background:var(--accent);box-shadow:0 0 5px oklch(.85 .18 150 / .5)}
  .streak-cell.today{outline:1px dashed var(--accent-2);outline-offset:1px}
  .empty{text-align:center;padding:40px 20px}
  .empty .micro{margin-bottom:10px}
  .toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--bg-2);border:1px solid var(--accent);color:var(--accent);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:500;z-index:60;box-shadow:0 12px 30px -10px oklch(0 0 0 / .6);animation:toastin .25s ease}
  @keyframes toastin{from{transform:translate(-50%, 20px);opacity:0}to{transform:translate(-50%, 0);opacity:1}}
  .tx-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:oklch(0.18 .007 250 / .5);border:1px solid var(--hair)}
  .tx-emj{width:36px;height:36px;border-radius:10px;background:var(--bg-2);display:grid;place-items:center;font-size:18px;flex:none}
  .tx-amt{font-family:var(--mono);font-size:14px;font-weight:500;white-space:nowrap}
  .signal{flex:none;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid}
  .signal.green{background:oklch(.85 .18 150 / .12);border-color:oklch(.85 .18 150 / .3);color:var(--accent)}
  .signal.blue{background:oklch(.72 .17 250 / .12);border-color:oklch(.72 .17 250 / .3);color:var(--accent-2)}
  .signal.amber{background:oklch(.82 .16 80 / .12);border-color:oklch(.82 .16 80 / .3);color:var(--warn)}
  .scroller{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px}
  .level-card{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:linear-gradient(180deg, oklch(0.19 .007 250), oklch(0.16 .006 250));border:1px solid var(--hair)}
  .level-card.cur{border-color:oklch(.85 .18 150 / .4);box-shadow:0 0 24px -8px oklch(.85 .18 150 / .4)}
  .level-card.done{opacity:.85}
  .level-badge{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--mono);font-weight:600;background:var(--bg-2);border:1px solid var(--hair);color:var(--fg-3)}
  .level-badge.done{background:linear-gradient(135deg, var(--accent), oklch(.7 .15 150));border-color:var(--accent);color:#06120c}
  .level-badge.cur{border-color:var(--accent);color:var(--accent)}
  .msg{padding:12px 14px;border-radius:16px;font-size:13.5px;line-height:1.5;max-width:84%}
  .msg.ai{background:oklch(0.18 .007 250);border:1px solid var(--hair);border-bottom-left-radius:4px;align-self:flex-start}
  .msg.me{background:linear-gradient(180deg, oklch(.72 .17 250 / .9), oklch(.55 .17 250 / .9));border:1px solid oklch(.72 .17 250 / .4);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
  .msg .ts{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;margin-top:6px;opacity:.7}
  .install-hint{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:12px;right:12px;background:var(--bg-1);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;z-index:30;animation:slide .3s}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="bos-store.js"></script>
<script type="text/babel" src="bos-icons.jsx"></script>

</body>
